name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: npm audit (report only)
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit reported dependency findings. Deployment is intentionally not blocked by this separate audit job."
          fi
          exit 0

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Verify Live2D source and references
        shell: bash
        run: |
          set -euo pipefail
          node scripts/restore-live2d.cjs
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('public/live2d');
          const modelPath = path.join(root, 'MassageSeacubus_rei.model3.json');
          const model = JSON.parse(fs.readFileSync(modelPath, 'utf8'));
          const refs = model.FileReferences || {};
          const refsToCheck = new Set([refs.Moc, refs.Physics, refs.Pose, refs.DisplayInfo]);
          for (const file of refs.Textures || []) refsToCheck.add(file);
          for (const expression of refs.Expressions || []) if (expression?.File) refsToCheck.add(expression.File);
          for (const group of Object.values(refs.Motions || {})) {
            for (const motion of Array.isArray(group) ? group : []) if (motion?.File) refsToCheck.add(motion.File);
          }
          for (const file of refsToCheck) {
            if (!file || file.startsWith('/') || file.includes('..')) throw new Error(`Unsafe reference: ${file}`);
            const full = path.resolve(root, file);
            if (!fs.existsSync(full) || !fs.statSync(full).isFile()) throw new Error(`Missing referenced Live2D asset: ${file}`);
          }
          console.log(`Verified ${refsToCheck.size} referenced Live2D files in public/live2d.`);
          NODE

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify final Live2D artifact
        run: npm run verify:live2d

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
