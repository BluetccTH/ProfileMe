name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ตรวจ export ก่อน build
      - name: Check Live2DAvatar export
        run: |
          echo "=== Live2DAvatar.tsx ==="
          grep -n "Live2DAvatar" src/components/Live2DAvatar.tsx || true

          echo "=== App import ==="
          grep -n "Live2DAvatar" src/App.tsx || true

      - name: Build
        run: npm run build

      # ตรวจไฟล์ Live2D หลัง build
      - name: Verify Live2D assets
        run: |
          echo "=== Live2D files in dist ==="
          find dist -type f \( \
            -name "*.model3.json" \
            -o -name "*.moc3" \
            -o -name "*.png" \
            -o -name "*.physics3.json" \
          \) | sort

          echo "=== File sizes ==="
          find dist -type f \( \
            -name "*.moc3" \
            -o -name "*.png" \
          \) -exec ls -lh {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
