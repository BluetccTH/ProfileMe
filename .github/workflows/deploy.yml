name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Live2DAvatar export
        run: |
          echo "=== Live2DAvatar.tsx ==="
          grep -n "Live2DAvatar" src/components/Live2DAvatar.tsx || true
          echo "=== App import ==="
          grep -n "Live2DAvatar" src/App.tsx || true
      - name: Enable uncapped Live2D/Pixi FPS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/Live2DAvatar.tsx")
          text = path.read_text(encoding="utf-8")
          marker = 'Live2DModel.registerTicker(PIXI.Ticker);'
          injection = '''Live2DModel.registerTicker(PIXI.Ticker);
          // Uncap PixiJS/Live2D ticker FPS. 0 = no artificial FPS limit.
          // The browser/display refresh rate remains the real upper bound.
          try {
            (PIXI.Ticker.shared as any).maxFPS = 0;
            (PIXI.Ticker.shared as any).minFPS = 0;
          } catch (e) {}
          '''
          if "(PIXI.Ticker.shared as any).maxFPS = 0" not in text:
              if marker not in text:
                  raise SystemExit("Could not find Live2D ticker registration marker")
              path.write_text(text.replace(marker, injection, 1), encoding="utf-8")
              print("[FPS] Injected uncapped shared Pixi ticker settings")
          else:
              print("[FPS] Uncapped ticker settings already present")
          PY
      - name: Build
        run: npm run build

      # The model's native texture is 4096x8192 (not 4096x4096).
      # Keep the original native texture intact; only reject textures larger than 8192px.
      - name: Verify Live2D texture (native 4096x8192)
        run: |
          set -e
          TEXTURE="dist/live2d/MassageSeacubus_rei.4096/texture_00.png"
          if [ ! -f "$TEXTURE" ]; then
            echo "Live2D texture not found: $TEXTURE"
            exit 1
          fi
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - "$TEXTURE" <<'PY'
          import sys
          from PIL import Image
          from pathlib import Path
          path = Path(sys.argv[1])
          with Image.open(path) as image:
              width, height = image.size
              print(f"Live2D texture dimensions: {width}x{height}")
              print(f"Live2D texture size: {path.stat().st_size} bytes")
              # This model is natively 4096x8192. Preserve it instead of
              # incorrectly rejecting the second dimension.
              if width > 4096 or height > 8192:
                  raise SystemExit("ERROR: Live2D texture exceeds native 4096x8192 limit")
              if width != 4096 or height != 8192:
                  print("WARNING: texture dimensions differ from the model's native 4096x8192 texture")
          PY
          echo "=== Live2D files in dist ==="
          find dist -type f \( \
            -name "*.model3.json" \
            -o -name "*.moc3" \
            -o -name "*.png" \
            -o -name "*.physics3.json" \
          \) | sort
          echo "=== File sizes ==="
          find dist -type f \( \
            -name "*.moc3" \
            -o -name "*.png" \
          \) -exec ls -lh {} \;
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
