name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check legacy Live2D base
        run: |
          echo "=== Live2DAvatar legacy base ==="
          grep -n "Live2DLoader\|pixi-live2d-display/cubism4\|autoInteract\|ParamAngleX\|ParamBiaoQ1" src/components/Live2DAvatar.tsx || true

      - name: Build
        run: npm run build

      - name: Verify Live2D assets
        run: |
          echo "=== Live2D files in dist ==="
          find dist -type f \( \
            -name "*.model3.json" \
            -o -name "*.moc3" \
            -o -name "*.png" \
            -o -name "*.physics3.json" \
          \) | sort
          echo "=== MOC/texture sizes ==="
          find dist -type f \( \
            -name "*.moc3" \
            -o -name "*.png" \
          \) -exec ls -lh {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
