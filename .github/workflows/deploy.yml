name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify Live2D assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/live2d"
          MODEL="$ROOT/MassageSeacubus_rei.model3.json"
          MOC="$ROOT/MassageSeacubus_rei.moc3"
          TEXTURE="$ROOT/MassageSeacubus_rei.4096/texture_00.png"
          PHYSICS="$ROOT/MassageSeacubus_rei.physics3.json"

          for file in "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS"; do
            test -s "$file" || { echo "Missing or empty asset: $file"; exit 1; }
          done

          test "$(head -c 4 "$MOC")" = "MOC3" || { echo "Invalid MOC3 header"; exit 1; }
          echo "Live2D assets verified."
          ls -lh "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
