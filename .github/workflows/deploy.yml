name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify original MassageSeacubus_rei files
        run: |
          set -e
          ROOT="public/live2d"
          test -f "$ROOT/MassageSeacubus_rei.model3.json"
          test -f "$ROOT/MassageSeacubus_rei.moc3"
          test -f "$ROOT/MassageSeacubus_rei.physics3.json"
          test -f "$ROOT/MassageSeacubus_rei.cdi3.json"
          test -d "$ROOT/MassageSeacubus_rei.4096"
          echo "Original MassageSeacubus_rei files found."

      - name: Build
        run: npm run build

      - name: Verify deployed Live2D assets
        run: |
          set -e
          ROOT="dist/live2d/MassageSeacubus_rei"
          test -f "$ROOT/MassageSeacubus_rei.model3.json"
          test -f "$ROOT/MassageSeacubus_rei.moc3"
          test -f "$ROOT/MassageSeacubus_rei.physics3.json"
          test -f "$ROOT/MassageSeacubus_rei.cdi3.json"
          test -d "$ROOT/MassageSeacubus_rei.4096"
          echo "=== Texture files ==="
          find "$ROOT/MassageSeacubus_rei.4096" -type f -name '*.png' -exec ls -lh {} \;
          echo "=== Model references ==="
          grep -E 'MassageSeacubus_rei|texture_00|Physics|Motions|Expressions' "$ROOT/MassageSeacubus_rei.model3.json" || true
          echo "MassageSeacubus_rei deployed without texture resizing."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
