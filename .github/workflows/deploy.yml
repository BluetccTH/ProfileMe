name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Dependency security audit
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify Live2D assets and integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/live2d"
          MODEL="$ROOT/MassageSeacubus_rei.model3.json"
          MOC="$ROOT/MassageSeacubus_rei.moc3"
          TEXTURE="$ROOT/MassageSeacubus_rei.4096/texture_00.png"
          PHYSICS="$ROOT/MassageSeacubus_rei.physics3.json"
          CDI="$ROOT/MassageSeacubus_rei.cdi3.json"

          for file in "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS" "$CDI"; do
            test -s "$file" || { echo "Missing or empty asset: $file"; exit 1; }
          done

          test "$(head -c 4 "$MOC")" = "MOC3" || {
            echo "Invalid MOC3 header"; exit 1;
          }

          node -e 'const fs=require("fs"); const p=process.argv[1]; const m=JSON.parse(fs.readFileSync(p,"utf8")); const t=m.FileReferences?.Textures; if(!Array.isArray(t)||!t.length) throw new Error("No texture reference"); for(const x of t){ if(x.includes("..") || x.startsWith("/")) throw new Error(`Unsafe texture path: ${x}`); } console.log("Model JSON references validated.");' "$MODEL"

          sha256sum "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS" "$CDI"
          echo "Live2D assets verified; binaries are deployed byte-for-byte."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
