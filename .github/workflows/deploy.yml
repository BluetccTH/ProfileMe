name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify Live2D assets
        shell: bash
        run: |
          set -euo pipefail

          MODEL="dist/live2d/MassageSeacubus_rei.model3.json"
          MOC="dist/live2d/MassageSeacubus_rei.moc3"
          TEXTURE="dist/live2d/MassageSeacubus_rei.4096/texture_00.png"
          PHYSICS="dist/live2d/MassageSeacubus_rei.physics3.json"

          for file in "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS"; do
            test -s "$file" || { echo "Missing or empty Live2D asset: $file"; exit 1; }
          done

          MOC_HEADER="$(head -c 4 "$MOC")"
          test "$MOC_HEADER" = "MOC3" || { echo "Invalid MOC3 header"; exit 1; }

          echo "=== Live2D ==="
          ls -lh "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS"

          echo "=== Texture ==="
          node -e "const fs=require('fs');const b=fs.readFileSync(process.argv[1]);console.log('PNG bytes:',b.length);if(b.length<8||!b.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))process.exit(1)" "$TEXTURE"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          compression-level: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
