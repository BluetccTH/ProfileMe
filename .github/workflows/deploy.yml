name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify primary Live2D package
        run: |
          set -e
          ROOT="public/live2d"
          test -f "$ROOT/MassageSeacubus_rei.model3.json"
          test -f "$ROOT/MassageSeacubus_rei.moc3"
          test -f "$ROOT/MassageSeacubus_rei.physics3.json"
          test -f "$ROOT/MassageSeacubus_rei.cdi3.json"
          test -d "$ROOT/MassageSeacubus_rei.4096"
          test -f "$ROOT/MassageSeacubus_rei.4096/texture_00.png"
          echo "Primary public/live2d package found."
          echo "MOC3: $(stat -c%s "$ROOT/MassageSeacubus_rei.moc3") bytes"
          echo "Texture: $(stat -c%s "$ROOT/MassageSeacubus_rei.4096/texture_00.png") bytes"

      - name: Build
        run: npm run build

      - name: Verify built Live2D assets
        run: |
          set -e
          # Vite copies public/ verbatim to the root of dist/.
          ROOT="dist/live2d"
          test -f "$ROOT/MassageSeacubus_rei.model3.json"
          test -f "$ROOT/MassageSeacubus_rei.moc3"
          test -f "$ROOT/MassageSeacubus_rei.physics3.json"
          test -f "$ROOT/MassageSeacubus_rei.cdi3.json"
          test -d "$ROOT/MassageSeacubus_rei.4096"
          test -f "$ROOT/MassageSeacubus_rei.4096/texture_00.png"
          echo "=== Built primary model ==="
          ls -lh "$ROOT/MassageSeacubus_rei.moc3"
          echo "=== Built native texture ==="
          ls -lh "$ROOT/MassageSeacubus_rei.4096/texture_00.png"
          echo "public/live2d deployed without texture resize/recompression."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
