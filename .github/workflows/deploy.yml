name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Live2DAvatar export
        run: |
          echo "=== Live2DAvatar.tsx ==="
          grep -n "Live2DAvatar" src/components/Live2DAvatar.tsx || true
          echo "=== App import ==="
          grep -n "Live2DAvatar" src/App.tsx || true

      - name: Build
        run: npm run build

      - name: Verify Live2D assets
        shell: bash
        run: |
          set -e
          MODEL="dist/live2d/MassageSeacubus_rei.model3.json"
          MOC="dist/live2d/MassageSeacubus_rei.moc3"
          TEXTURE="dist/live2d/MassageSeacubus_rei.4096/texture_00.png"
          PHYSICS="dist/live2d/MassageSeacubus_rei.physics3.json"

          for file in "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS"; do
            if [ ! -f "$file" ]; then
              echo "Missing Live2D asset: $file"
              exit 1
            fi
          done

          echo "=== Live2D files in dist ==="
          find dist/live2d -type f | sort

          echo "=== File sizes ==="
          ls -lh "$MODEL" "$MOC" "$TEXTURE" "$PHYSICS"

          echo "=== MOC3 signature ==="
          xxd -l 4 "$MOC"

          echo "=== Texture dimensions ==="
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - "$TEXTURE" <<'PY'
          import sys
          from PIL import Image
          path = sys.argv[1]
          with Image.open(path) as image:
              width, height = image.size
              print(f"Live2D texture dimensions: {width}x{height}")
              print(f"Live2D texture size: {__import__('os').path.getsize(path)} bytes")
              if width > 4096 or height > 8192:
                  raise SystemExit("ERROR: Live2D texture exceeds 4096x8192")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
